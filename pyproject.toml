[project]
name = "fastapi-cosmos-api"
version = "0.1.0"
description = "Production-style FastAPI backend: async Cosmos DB repositories, JWT auth, structured logging."
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
