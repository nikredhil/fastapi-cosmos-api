# Render blueprint for the RentWise FastAPI backend.
# Create the service: Render Dashboard → New → Blueprint → pick this repo.
# See DEPLOY.md for the full walkthrough.
services:
  - type: web
    name: rentwise-api
    runtime: python
    plan: free
    branch: rentwise-rebuild
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Pin Python 3.12 — pydantic-core ships prebuilt wheels for it. (Render's
      # default 3.14 has no wheel, so pip tries to compile it with Rust and fails.)
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: prod
      # Persistent storage via Azure Cosmos DB. The endpoint + key are secrets,
      # so they're set in the Render dashboard (sync:false), not committed here.
      - key: DB_BACKEND
        value: cosmos
      - key: COSMOS_DATABASE
        value: rentwise
      # Shared throughput so all containers share one 1000 RU/s pool — free on a
      # Free-Tier Cosmos account.
      - key: COSMOS_SHARED_THROUGHPUT
        value: "1000"
      - key: COSMOS_ENDPOINT
        sync: false
      - key: COSMOS_KEY
        sync: false
      # Uploaded images (contract/Aadhaar photos) persist in Azure Blob Storage.
      # The connection string is a secret — set it in the Render dashboard.
      - key: AZURE_STORAGE_CONNECTION_STRING
        sync: false
      - key: BLOB_CONTAINER
        value: uploads
      # Local-disk fallback (used only if the connection string above is unset).
      - key: DATA_DIR
        value: ./data
      - key: UPLOADS_DIR
        value: ./data/uploads
      # Lock CORS to your domain (the Vite frontend's origin).
      - key: CORS_ORIGINS
        value: https://wiserent.in,https://www.wiserent.in
      # Auth secret for local email/password accounts — generated once by Render.
      - key: JWT_SECRET
        generateValue: true
      # Contract parsing (optional). Set the value in the dashboard.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-opus-4-8

    # Persistent disk (paid plans only). Uncomment to keep file-backend data and
    # uploaded images across restarts; DATA_DIR/UPLOADS_DIR above point at it.
    # disk:
    #   name: rentwise-data
    #   mountPath: /var/data
    #   sizeGB: 1
