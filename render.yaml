# Render blueprint for the RentWise FastAPI backend.
# Create the service: Render Dashboard → New → Blueprint → pick this repo.
# See DEPLOY.md for the full walkthrough.
services:
  - type: web
    name: rentwise-api
    runtime: python
    plan: free
    branch: rentwise-rebuild
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Pin Python 3.12 — pydantic-core ships prebuilt wheels for it. (Render's
      # default 3.14 has no wheel, so pip tries to compile it with Rust and fails.)
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: prod
      # Storage. The free plan has an EPHEMERAL filesystem — data resets on every
      # restart/deploy. For real persistence either:
      #   (a) upgrade to a paid instance and uncomment the `disk:` block below, or
      #   (b) use Cosmos: set DB_BACKEND=cosmos and the COSMOS_* vars (sync:false).
      - key: DB_BACKEND
        value: file
      # Writable path inside the project dir (works on the free plan, but is
      # EPHEMERAL — resets on restart). With a persistent disk, change these to
      # the disk's mountPath (e.g. /var/data and /var/data/uploads).
      - key: DATA_DIR
        value: ./data
      - key: UPLOADS_DIR
        value: ./data/uploads
      # Lock CORS to your domain (the Vite frontend's origin).
      - key: CORS_ORIGINS
        value: https://wiserent.in,https://www.wiserent.in
      # Auth secret for local email/password accounts — generated once by Render.
      - key: JWT_SECRET
        generateValue: true
      # Contract parsing (optional). Set the value in the dashboard.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-opus-4-8
      # --- Cosmos DB (only if DB_BACKEND=cosmos) — set these in the dashboard ---
      # - key: COSMOS_ENDPOINT
      #   sync: false
      # - key: COSMOS_KEY
      #   sync: false
      # - key: COSMOS_DATABASE
      #   value: rentwise

    # Persistent disk (paid plans only). Uncomment to keep file-backend data and
    # uploaded images across restarts; DATA_DIR/UPLOADS_DIR above point at it.
    # disk:
    #   name: rentwise-data
    #   mountPath: /var/data
    #   sizeGB: 1
